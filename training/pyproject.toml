[project]
name = "spinemetrics-training"
version = "0.1.0"
description = "Entrenamiento del modelo de segmentación vertebral de SpineMetrics, fuera del bundle de la aplicación (SPEC.md §3)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydicom>=2.4",
  "torch>=2.2",
  "onnx>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spinemetrics_training"]
