name: Deploy to GitHub Pages

# Despliega el build de producción de SpineMetrics (SPA estática, sin
# backend — SPEC.md §11, "procesamiento exclusivamente local") a GitHub
# Pages. Sólo corre sobre la rama de trabajo actual, nunca toca main.
on:
  push:
    branches: [claude/fase-1-ejecucion-any8w0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
